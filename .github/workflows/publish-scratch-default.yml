name: Publish Scratch Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-scratch-default.yml"
      - "ops/scratch-default/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: scratch-default

jobs:
  build:
    name: Build and push scratch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_namespace=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ops/scratch-default
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.image_namespace }}/${{ env.IMAGE }}:latest
            ${{ steps.meta.outputs.image_namespace }}/${{ env.IMAGE }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=scratch-default
          cache-to: type=gha,mode=max,scope=scratch-default
