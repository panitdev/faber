[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[dependencies]
llm = { path = "../llm" }
environment = { path = "../environment" }
search = { path = "../search" }
deno_core = "0.409"
deno_error = "0.7"
deno_webidl = "0.256"
deno_web = "0.287"
deno_crypto = "0.270"
deno_net = "0.248"
deno_telemetry = "0.78"
deno_fetch = "0.280"
deno_permissions = "0.115"
sys_traits = { version = "0.1.28", features = ["real", "libc"] }
deno_ast = { version = "0.53.3", features = ["transpiling"] }
deno_graph = { version = "0.110", default-features = false, features = ["swc"] }
include_dir = "0.7"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
futures-util = "0.3"
async-stream = "0.3"
thiserror = "1"
tracing = "0.1"
secrecy = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tempfile = "3"

[[example]]
name = "run"
path = "examples/run.rs"
