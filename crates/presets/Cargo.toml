[package]
name = "presets"
version = "0.1.0"
edition = "2024"

# A leaf crate: no `llm`, no `harness`, no `environment`, no database. A model
# preset is a read-only description of a model somebody else publishes — what
# it can do and what it costs — not a row this service owns. See the module
# docs for why the catalog is fetched rather than materialized.
[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
