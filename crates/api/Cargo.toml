[package]
name = "api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/main.rs"

[features]
# Compiles TestProvider in. Never enable for a production build — see
# `build_auth_provider`, which still requires SURGE_TEST_PROVIDER=true on top.
test-provider = ["surge/test-provider"]

[dependencies]
# The run path: a run is a task in this process.
llm = { path = "../llm" }
harness = { path = "../harness" }
environment = { path = "../environment" }
proxies = { path = "../proxies" }
search = { path = "../search" }
presets = { path = "../presets" }
plugin = { path = "../plugin" }
# Scratch: the per-session environment, virtual or sandboxed.
scratch = { path = "../scratch" }
axum = { version = "0.8", features = ["macros", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
url = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
# The daemons' outbound WebSocket client. Its own TLS config, with the
# provider named and webpki's roots, so nothing about a plugin's connection
# comes from this process's ambient setup (both rustls providers are compiled
# into this binary, and rustls refuses to pick a default between them).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.2", features = [
  "postgres",
  "chrono",
  "uuid",
  "serde_json",
] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
diesel_migrations = "2"
bb8 = "0.8"
uuid = { version = "1", features = ["serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
russh = "0.62.6"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
thiserror = "1"
secrecy = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
libc = "0.2"
surge = { git = "https://github.com/panitdev/surge", rev = "37b17b8fad3093eb8ed633b21016659ccdf6c4b3", features = [
  "router",
] }
