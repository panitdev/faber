[package]
name = "plugin"
version = "0.1.0"
edition = "2024"

# The plugin contract (`faber:plugin@1.0.0`) and the core's half of it: the
# manifest rules, the notice queue, bind-time checks and the run-start
# lifecycle. No `harness`, no `environment`, no database — a built-in plugin
# that needs those lives with whoever owns them and implements [`Plugin`]
# there. `llm` only for the tool definitions handed to a run.
[dependencies]
llm = { path = "../llm" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
